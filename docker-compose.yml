# Optional: run the mock API (and k6) in containers instead of locally.
#
#   docker compose up -d mock-api                      # start the mock on :8080
#   docker compose run --rm k6 run /work/k6/smoke-test.js
#   docker compose run --rm k6 run /work/k6/load-test.js
#   docker compose down
#
# Inside the compose network k6 reaches the mock at http://mock-api:8080.
services:
  mock-api:
    image: node:22-alpine
    working_dir: /app
    command: node mock-api/server.js
    environment:
      MOCK_HOST: 0.0.0.0
      MOCK_PORT: 8080
      MOCK_TELEMETRY_FILE: /app/results/mock-server-telemetry.csv
    env_file:
      - path: .env
        required: false
    ports:
      - "8080:8080"
    volumes:
      - ./mock-api:/app/mock-api:ro
      - ./scripts:/app/scripts:ro
      - ./results:/app/results
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 5

  k6:
    image: grafana/k6:latest
    profiles: ["tools"]          # only started via `docker compose run k6 ...`
    working_dir: /work
    environment:
      TARGET_BASE_URL: http://mock-api:8080
      # The target is the compose-local mock service above, not a remote system.
      CONFIRM_AUTHORIZED_TARGET: "true"
    env_file:
      - path: .env
        required: false
    volumes:
      - ./:/work
    depends_on:
      mock-api:
        condition: service_healthy
